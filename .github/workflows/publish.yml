name: Publish to npm

# Runs when a version tag is pushed, e.g. `npm version patch && git push --follow-tags`.
# Uses npm trusted publishing (OIDC) - no npm token stored in GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm test
      - run: npm publish
